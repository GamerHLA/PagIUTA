# Escribe los cambios en archivos locales cuando ejecutas: npx decap-server
local_backend: true

backend:
  name: test-repo

# Dónde se guardarán las imágenes que arrastre el usuario en el panel
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Configuración del formulario de edición
collections:
  - name: "multimedia"
    label: "Material de Estudio"
    folder: "data"
    extension: "json"
    format: "json"
    slug: "multimedia"
    clearable: true
    editor:
      preview: false # Desactivar vista previa de código para no confundir al usuario
    fields:
      - label: "Material de la Biblioteca"
        name: "multimedia_items"
        widget: "list" # Permite añadir una lista de tarjetas (añadir, borrar, reordenar)
        fields:
          - label: "Tipo de Recurso"
            name: "tipo"
            widget: "select"
            options: ["imagen", "video"]
            default: "imagen"
          - label: "Título del Material"
            name: "titulo"
            widget: "string"
            hint: "Ejemplo: Guía de Normas APA"
          - label: "Descripción o Resumen"
            name: "descripcion"
            widget: "text"
          - label: "Imagen (subir archivo)"
            name: "url"
            widget: "image"
            required: false
            condition:
              field: tipo
              value: imagen
          - label: "Enlace de YouTube (formato embed)"
            name: "url"
            widget: "string"
            required: false
            hint: "https://www.youtube.com/embed/ID_DEL_VIDEO"
            condition:
              field: tipo
              value: video